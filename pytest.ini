[pytest]
testpaths = tests/unit
python_files = test_*.py
addopts = -v

# La racine du projet est ajoutee au sys.path pour que "from app.store import ..."
# fonctionne dans les tests. Sans cette ligne, seul "python -m pytest" marche
# (car il ajoute le repertoire courant au sys.path), alors que la commande
# "pytest" utilisee en CI echoue avec ModuleNotFoundError: No module named 'app'.
pythonpath = .
