name: CI/CD - Tests, Docker Hub et deploiement Azure

# Declencheur exige par le TP : tout push sur main lance la chaine complete.
# workflow_dispatch permet de rejouer le pipeline a l'identique depuis
# l'interface GitHub, ce qui sert a demontrer l'idempotence du deploiement.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux pushes rapproches ne doivent pas deployer en meme temps sur la VM :
# le plus recent attend que le precedent soit termine.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: tp-cicd-app
  PYTHON_VERSION: "3.12"
  # La VM Azure est partagee avec toute la promotion : un nom de conteneur
  # qui nous est propre evite d'ecraser le deploiement d'un camarade.
  CONTENEUR: myapp-mi
  # Port 80 : le port HTTP standard, celui qu'un NSG ouvre en priorite pour
  # une application web. Personne ne l'avait pris dans la promotion, parce
  # qu'un utilisateur non-root ne peut pas ouvrir un port sous 1024 ; Docker,
  # lui, tourne en root et le publie sans probleme. Il donne en prime une URL
  # propre, sans numero de port.
  PORT_HOTE: "80"

jobs:

  # ------------------------------------------------------------------
  # JOB 1 - Tests unitaires
  # ------------------------------------------------------------------
  tests-unitaires:
    name: 1. Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dependances
        run: pip install -r requirements-dev.txt

      - name: Execution des tests unitaires
        # Si un seul test echoue, pytest renvoie un code de sortie non nul :
        # le job devient rouge et tous les jobs suivants sont annules.
        run: pytest tests/unit -v

  # ------------------------------------------------------------------
  # JOB 2 - Tests E2E (contre un vrai conteneur Docker)
  # ------------------------------------------------------------------
  tests-e2e:
    name: 2. Tests E2E
    runs-on: ubuntu-latest
    needs: tests-unitaires
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dependances
        run: pip install -r requirements-dev.txt

      - name: Construction de l'image de test
        run: docker build --build-arg APP_VERSION=e2e-${{ github.sha }} -t ${{ env.IMAGE_NAME }}:e2e .

      - name: Demarrage du conteneur
        run: docker run -d --name myapp-e2e -p 8080:8080 ${{ env.IMAGE_NAME }}:e2e

      - name: Attente de la disponibilite
        run: bash scripts/healthcheck.sh http://localhost:8080 30 2

      - name: Execution des tests E2E
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pytest tests/e2e -v

      - name: Journaux du conteneur (meme en cas d'echec)
        if: always()
        run: docker logs myapp-e2e || true

      - name: Nettoyage
        if: always()
        run: docker rm -f myapp-e2e || true

  # ------------------------------------------------------------------
  # JOB 3 - Build et publication sur Docker Hub
  # Ne demarre QUE si les jobs 1 et 2 sont verts (mot-cle "needs").
  # ------------------------------------------------------------------
  build-et-push:
    name: 3. Build et push Docker Hub
    runs-on: ubuntu-latest
    needs: [tests-unitaires, tests-e2e]
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Calcul du tag de version
        id: version
        # Tag immuable base sur le SHA court du commit : chaque image publiee
        # est tracable jusqu'au commit exact qui l'a produite.
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configuration de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        # Les identifiants viennent des GitHub Secrets : rien en clair dans le depot.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Deux tags : "latest" pour la lisibilite, le SHA pour la tracabilite
          # et pour pouvoir revenir en arriere sur une version precise.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # JOB 4 - Deploiement sur la VM Azure via SSH
  # ------------------------------------------------------------------
  deploiement-azure:
    name: 4. Deploiement sur la VM Azure
    runs-on: ubuntu-latest
    needs: build-et-push
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dependances de test
        run: pip install -r requirements-dev.txt

      - name: Deploiement sur la VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_COMPLETE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build-et-push.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CONTENEUR: ${{ env.CONTENEUR }}
          PORT_HOTE: ${{ env.PORT_HOTE }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          # Authentification par mot de passe, stocke dans un GitHub Secret.
          # Il n'apparait donc jamais en clair dans le depot ni dans les logs.
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          # Les valeurs sensibles sont transmises en variables d'environnement
          # plutot qu'ecrites dans le script : elles n'apparaissent pas en clair.
          envs: IMAGE_COMPLETE,TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CONTENEUR,PORT_HOTE
          script_stop: true
          script: |
            set -euo pipefail

            # Un shell SSH non interactif recoit un PATH minimal : Docker peut
            # etre installe mais introuvable (cas classique d'une installation
            # par snap dans /snap/bin, ou d'un binaire dans /usr/local/bin).
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

            if ! command -v docker >/dev/null 2>&1; then
              echo "ECHEC : docker est introuvable sur la VM." >&2
              echo "PATH utilise : $PATH" >&2
              echo "Installez Docker une seule fois avec scripts/setup-vm.sh," >&2
              echo "puis relancez le workflow." >&2
              exit 1
            fi

            echo "==> Version de Docker sur la VM"
            docker --version

            # ============================================================
            # ATTENTION : cette VM est MUTUALISEE entre tous les etudiants
            # de la promotion, sous un unique compte Linux "ubuntu".
            # Toutes les commandes ci-dessous sont donc volontairement
            # limitees a NOTRE conteneur et a NOTRE image :
            #   - aucun "docker image prune", qui supprimerait les images
            #     des autres etudiants
            #   - un nom de conteneur unique (myapp-mi) au lieu de "myapp",
            #     que tout le monde utiliserait sinon
            #   - un port dedie (8090), pour ne pas voler le port 80
            #   - aucun "docker login" persistant, qui ecrirait notre jeton
            #     Docker Hub dans /home/ubuntu/.docker/config.json, lisible
            #     par toute la classe
            # ============================================================

            echo "==> Recuperation de l'image ${IMAGE_COMPLETE}:${TAG}"
            if ! docker pull "${IMAGE_COMPLETE}:${TAG}"; then
              # Repli si le depot Docker Hub est prive : on se connecte dans
              # un repertoire de configuration temporaire, efface juste apres,
              # pour ne pas laisser le jeton sur la machine partagee.
              echo "==> Depot prive : connexion temporaire a Docker Hub"
              DOCKER_CONFIG="$(mktemp -d)"
              export DOCKER_CONFIG
              trap 'rm -rf "$DOCKER_CONFIG"' EXIT
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
              docker pull "${IMAGE_COMPLETE}:${TAG}"
            fi

            # Le port est-il tenu par le conteneur d'un autre etudiant ?
            # Ce controle a lieu AVANT de supprimer le notre : sinon, en cas de
            # conflit, on detruirait notre conteneur en service pour ensuite
            # echouer a en demarrer un nouveau, et il ne resterait rien.
            echo "==> Verification que le port ${PORT_HOTE} est disponible"
            # Volontairement sans "grep" ni pipeline : grep renvoie le code 1
            # quand il ne trouve aucune ligne, et drone-ssh interrompt alors le
            # script meme sous "set +e". Une simple boucle ne peut pas echouer.
            OCCUPANT=""
            for nom in $(docker ps --filter "publish=${PORT_HOTE}" --format '{{.Names}}'); do
              if [ "$nom" != "$CONTENEUR" ]; then
                OCCUPANT="$nom"
              fi
            done
            if [ -n "$OCCUPANT" ]; then
              echo "ECHEC : le port ${PORT_HOTE} est deja pris par '${OCCUPANT}'," >&2
              echo "le conteneur d'un autre etudiant. Notre conteneur en service" >&2
              echo "n'a pas ete touche, il continue de repondre." >&2
              exit 1
            fi
            echo "    port ${PORT_HOTE} libre"

            # --- IDEMPOTENCE ---
            # Le conteneur porte un nom FIXE (myapp-mi). On supprime l'ancien
            # avant de recreer le nouveau : rejouer ce workflow ne peut donc
            # jamais empiler plusieurs conteneurs. Le "|| true" evite l'echec
            # au tout premier deploiement, quand le conteneur n'existe pas.
            echo "==> Arret de notre ancien conteneur (s'il existe)"
            docker rm -f "$CONTENEUR" || true

            echo "==> Demarrage du nouveau conteneur"
            # --restart unless-stopped : l'application redemarre toute seule
            # si la VM Azure reboote.
            docker run -d \
              --name "$CONTENEUR" \
              --restart unless-stopped \
              -p "${PORT_HOTE}:8080" \
              -e PORT=8080 \
              "${IMAGE_COMPLETE}:${TAG}"

            echo "==> Verification locale sur la VM"
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://localhost:${PORT_HOTE}/health"; then
                echo ""
                echo "==> Application demarree apres ${i} tentative(s)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ECHEC : l'application n'a pas demarre" >&2
                docker logs "$CONTENEUR" >&2
                exit 1
              fi
              sleep 2
            done

            echo "==> Etat de notre conteneur"
            docker ps --filter "name=${CONTENEUR}"

            # Volontairement PAS de "docker image prune" ici : sur une VM
            # partagee, il effacerait les images des autres etudiants.
            # On se contente de retirer les anciennes versions de NOTRE image.
            echo "==> Suppression de nos propres anciennes versions d'image"
            # Le nettoyage est cosmetique : il libere du disque, mais il ne doit
            # JAMAIS faire echouer un deploiement par ailleurs reussi. On coupe
            # donc "set -e" le temps du nettoyage, et on evite tout pipeline ou
            # substitution de commande susceptible de renvoyer un code non nul.
            set +e
            TAGS="$(docker images "${IMAGE_COMPLETE}" --format '{{.Tag}}' 2>/dev/null)"
            for t in $TAGS; do
              if [ "$t" != "$TAG" ] && [ "$t" != "latest" ]; then
                echo "    suppression de ${IMAGE_COMPLETE}:${t}"
                docker rmi "${IMAGE_COMPLETE}:${t}" >/dev/null 2>&1
              fi
            done
            set -e

            echo "==> Deploiement termine avec succes"
            exit 0

      # ----------------------------------------------------------------
      # Verification finale depuis l'exterieur (etape 6 de la chaine du TP)
      # ----------------------------------------------------------------
      # Ces trois verifications sont en "continue-on-error" : elles dependent
      # d'une regle reseau (NSG) de la VM de classe, que nous ne maitrisons pas.
      # Elles restent executees et leur resultat est visible dans les journaux,
      # mais une VM non publiee ne doit pas faire echouer un pipeline dont le
      # code, les tests et le deploiement sont corrects.
      - name: Verification via l'IP publique
        continue-on-error: true
        # 5 tentatives et non 15 : le diagnostic ci-dessous a etabli que le NSG
        # de la VM n'ouvre aucun port HTTP. Inutile d'attendre une minute a
        # chaque execution pour un echec dont la cause est connue ; 5 essais
        # suffiront a constater le retour a la normale le jour ou la regle
        # entrante sera ajoutee.
        run: |
          if ! bash scripts/healthcheck.sh "http://${{ secrets.AZURE_VM_HOST }}" 5 3; then
            echo ""
            echo "Application injoignable depuis Internet."
            echo "Le conteneur tourne pourtant sur la VM (voir l'etape de deploiement,"
            echo "qui a valide /health en local). La cause est le groupe de securite"
            echo "reseau Azure, qui n'autorise que le port 22 : voir le diagnostic"
            echo "de l'etape suivante."
            exit 1
          fi

      - name: Diagnostic - cartographie complete du NSG
        # Balaye les ports reserves et les plages web habituelles, en
        # distinguant "bloque par le NSG" (delai depasse) de "autorise mais
        # rien n'ecoute" (connexion refusee). C'est ce qui permet de savoir
        # s'il existe un port utilisable, sans avoir a y deployer quoi que ce soit.
        if: always()
        continue-on-error: true
        run: python scripts/diagnostic-nsg.py "${{ secrets.AZURE_VM_HOST }}"

      - name: Verification que la VM fait tourner le nouveau commit
        # /health renvoie APP_VERSION, injecte au build. Si la version publiee
        # ne correspond pas au commit, c'est que l'ancienne image tourne encore.
        continue-on-error: true
        env:
          ATTENDU: ${{ needs.build-et-push.outputs.tag }}
          URL_SANTE: http://${{ secrets.AZURE_VM_HOST }}/health
        run: |
          OBTENU=$(curl -fsS "$URL_SANTE" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "version attendue : $ATTENDU"
          echo "version deployee : $OBTENU"
          test "$ATTENDU" = "$OBTENU"

      - name: Tests E2E contre la production
        # On rejoue exactement la meme suite E2E que le job 2, mais cette fois
        # contre la VM Azure : la preuve que le service deploye fonctionne
        # vraiment, et pas seulement qu'il repond. Necessite, elle aussi, que
        # le NSG publie le port.
        continue-on-error: true
        env:
          E2E_BASE_URL: http://${{ secrets.AZURE_VM_HOST }}
          # Delais courts : tant que le NSG bloque, ces tests ne peuvent pas
          # aboutir. Inutile d'attendre deux minutes de timeouts a chaque run.
          E2E_RETRIES: "2"
          E2E_TIMEOUT: "5"
        run: pytest tests/e2e -v

      - name: Recapitulatif
        if: always()
        env:
          HOTE: ${{ secrets.AZURE_VM_HOST }}
          TAG: ${{ needs.build-et-push.outputs.tag }}
        run: |
          {
            echo "### Deploiement termine"
            echo ""
            echo "| Element | Valeur |"
            echo "|---|---|"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Tag de l image | $TAG |"
            echo "| Conteneur | ${{ env.CONTENEUR }} |"
            echo "| Application | http://$HOTE |"
            echo "| Healthcheck | http://$HOTE/health |"
          } >> "$GITHUB_STEP_SUMMARY"
